name: Bug report
description: Report a reproducible simulation, training, export, or firmware issue
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation
        - Isaac Sim rendered lane
        - Isaac Lab training lane
        - Perception
        - Policy export
        - ESP32-S3 firmware
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, GPU/driver, Python, Isaac Sim, Isaac Lab, RSL-RL and commit SHA.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands, seed/config and minimal steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed secrets, credentials and private device information.
          required: true
